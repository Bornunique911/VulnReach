services:
  vulnreach:
    build: .
    ports:
      - "8000:8000"
    # Default mode is least-privilege (coverage-based runtime analysis).
    # eBPF tracing is intentionally NOT enabled by default; use a dedicated
    # eBPF profile/compose override when you explicitly need host tracing.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Shared work dir: coverage volumes + temp Dockerfiles + cloned repos
      # MUST be a bind mount (not a named volume) so the host Docker daemon
      # can resolve these paths when spawning sibling containers.
      - /tmp/vulnreach:/tmp/vulnreach
      # Persist scan results and config across restarts
      - ./scans:/app/scans
      - ./config:/app/config
      - ./libs:/app/libs
    environment:
      # Non-secret runtime paths — override in .env.local if needed.
      - VULNREACH_WORK_DIR=/tmp/vulnreach
      # DATABASE_URL, JWT_SECRET, SEED_ADMIN_* and optional keys come from .env.local.
    env_file:
      - .env.local
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    # Credentials are read from .env.local (same file used by the app container).
    # Required keys: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    env_file:
      - .env.local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vulnreach}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
