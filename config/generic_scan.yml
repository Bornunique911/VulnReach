scan:
  static_reachability: true
  tools:
    - git
    - trivy
    - tainter
    - multi_language_reachability
    - route_extractor
    - metadata
    - semgrep
    - dynamic_reachability

  runtime:
    enabled: true
    timeout: 180
    coverage_wait: 15
    container_port: 3000
    ebpf:
      enabled: false

  openapi_generator:
    enabled: false

  intelligent_dast:
    enabled: false

risk:
  exposure: public
  data_sensitivity: high

policy:
  block_if:
    - severity: CRITICAL
      verdict: CONFIRMED
    - severity: HIGH
      verdict: CONFIRMED
