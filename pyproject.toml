[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnreach"
version = "2.0.0"
description = "Vulnerability reachability scanner — proves which CVEs are actually exploitable"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "requests>=2.32",
    "rich>=13",
    "pyyaml>=6",
    "pydantic>=2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.135",
    "uvicorn>=0.40",
    "psycopg2-binary>=2.9",
    "slowapi>=0.1",
]
llm = [
    "anthropic>=0.85",
    "openai>=2.0",
]
full = [
    "vulnreach[server,llm]",
]

[project.scripts]
vulnreach = "vulnreach.cli.main:cli"

[tool.setuptools.packages.find]
include = ["vulnreach*"]
