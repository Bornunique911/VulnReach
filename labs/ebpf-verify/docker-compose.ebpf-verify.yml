services:

  # ── Target ─────────────────────────────────────────────────────────────────
  # Minimal Python Flask app compiled with USDT probes (ubuntu:22.04).
  target:
    build: ./target
    privileged: true          # required for eBPF / USDT from inside container
    cap_add:
      - SYS_PTRACE
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ── Agent ──────────────────────────────────────────────────────────────────
  # Orchestrates: ground truth → bpftrace → compare.
  # Build context is the parent directory so it can copy target/app.py.
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    privileged: true
    pid: "service:target"     # share target PID namespace — required for USDT probes
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - ./coverage-out:/coverage
    environment:
      - TARGET_HOST=target
      - TARGET_PORT=5000
      - COVERAGE_DIR=/coverage
    depends_on:
      target:
        condition: service_healthy
