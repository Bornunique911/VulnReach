networks:
  devblog: null
services:
  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      COVERAGE_PROCESS_START: /app/.coveragerc
      DATABASE_URL: postgresql://devblog:devblog@db:5432/devblog
      DJANGO_SETTINGS_MODULE: devblog.settings
    networks:
    - devblog
    ports:
    - 3000:3000
    volumes:
    - /var/folders/gr/zlq03smx65v7csnf5n276nx00000gn/T/vulnreach_cov_96xit_en:/coverage
  db:
    environment:
      POSTGRES_DB: devblog
      POSTGRES_PASSWORD: devblog
      POSTGRES_USER: devblog
    healthcheck:
      interval: 5s
      retries: 10
      test:
      - CMD-SHELL
      - pg_isready -U devblog
      timeout: 5s
    image: postgres:15-alpine
    networks:
    - devblog
    volumes:
    - pgdata:/var/lib/postgresql/data
  frontend:
    depends_on:
    - backend
    image: nginx:1.25-alpine
    networks:
    - devblog
    ports:
    - 80:80
    volumes:
    - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    - ./frontend:/usr/share/nginx/html:ro
version: '3.9'
volumes:
  pgdata: null
