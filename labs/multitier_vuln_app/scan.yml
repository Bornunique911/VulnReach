scan:
  static_reachability: true
  tools:
    - trivy
    - tainter
    - python_reachability
    - route_extractor
    - metadata
    - dynamic_reachability
    - intelligent_dast  
  runtime:
    enabled: true
    timeout: 60
    coverage_wait: 30
    container_port: 3000
  openapi_generator:
    enabled: false
  intelligent_dast:
    enabled: false
    provider: ollama
    model: qwen3-coder:480b-cloud
    max_iter: 5
    ollama_base_url: http://localhost:11434

risk:
  exposure: public
  data_sensitivity: high

policy:
  block_if:
    - severity: CRITICAL
      verdict: CONFIRMED
    - severity: HIGH
      verdict: CONFIRMED
